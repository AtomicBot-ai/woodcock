[project]
name = "woodcock"
version = "0.1.0"
description = "Lossless speculative decoding for Apple Silicon with a hidden-state drafter, in MLX with a C++20 runtime."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.32",
    "mlx-lm>=0.32",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "datasets>=3.0",
    "huggingface_hub>=1.0",
    "safetensors>=0.5",
]

[project.optional-dependencies]
test = ["pytest>=8", "scipy>=1.13"]

[project.scripts]
woodcock = "woodcock.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: test loads a real Qwen3 checkpoint (slow)",
]
