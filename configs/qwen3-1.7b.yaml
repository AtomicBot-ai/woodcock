include: [m4max-48gb.yaml]
regen:
  target: Qwen/Qwen3-1.7B
  prompts: data/prompts/train.jsonl
  out: data/regen/qwen3-1.7b.jsonl
  max_new_tokens: 512
  batch: 64
  limit: 9000
adapt:
  target: Qwen/Qwen3-1.7B
  data: data/regen/qwen3-1.7b.jsonl
  out: runs/adapt/qwen3-1.7b
  init: scratch
  lr: 1.0e-4
  warmup: 100
  total_steps: 2000
