# Drafter v2 for Qwen3-4B: same recipe and pool as configs/qwen3-1.7b-v2.yaml, answers
# regenerated by Qwen3-4B (scripts/cuda/regen_vllm.py). Trained on an H100 80 GB, so the
# micro-batch keeps the 1.7B's 2048 tokens (the M4 Max config uses 1536 for 4B); with the
# same grad_accum, one pass over the data is about the same ~6,400 steps.
include: [m4max-48gb.yaml]
adapt:
  target: Qwen/Qwen3-4B
  data: data/regen/qwen3-4b-v2.jsonl
  out: runs/adapt/qwen3-4b-v2
  init: scratch
  lr: 1.0e-4
  warmup: 200
  total_steps: 6400
  token_budget: 2048
  eval_every: 500
  save_every: 250
