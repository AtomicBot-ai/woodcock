# Drafter v2 for Qwen3-1.7B: same recipe as v1, trained with this repository's code on
# the larger pool (configs/data-v2.yaml, regenerated by the target with
# scripts/cuda/regen_vllm.py). One pass over the data instead of several epochs.
# total_steps is set on the command line once the data size is known
# (~ response+prompt tokens / 8k tokens per step).
include: [m4max-48gb.yaml]
adapt:
  target: Qwen/Qwen3-1.7B
  data: data/regen/qwen3-1.7b-v2.jsonl
  out: runs/adapt/qwen3-1.7b-v2
  init: scratch
  lr: 1.0e-4
  warmup: 200
  total_steps: 5500
  eval_every: 500
  save_every: 250
